spring:
  application:
    name: monitoring-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: monitoring-service
      auto-offset-reset: earliest

monitoring:
  thresholds:
    TEMPERATURE: 35
    HUMIDITY: 50

logging:
  level:
    org.apache.kafka: WARN
